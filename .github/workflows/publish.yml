name: publish due posts

on:
  schedule:
    # Hourly at :01 UTC. Any post whose slot time has passed goes out on the
    # next run, so a delayed or skipped run self-heals instead of losing a post.
    # The buffer alarm rides on this same run and picks its own hours; it used
    # to have a dedicated "1 9 * * *" line, but that collides with the hourly
    # one and GitHub delivers only a single schedule event, so the alarm step
    # was skipped every day it was supposed to fire.
    - cron: "1 * * * *"
    # A second, dedicated attempt a few minutes after each slot hour (he 06:00,
    # 10:00, 17:30; en 12:00, 16:00, 20:00). Added 20.9.2026: the hourly line
    # above is declared hourly but GitHub delivers it every 3 to 5 hours under
    # load, and on 20.9 both morning Hebrew posts sat in the queue until they
    # were kicked by hand. The Mac also kicks this workflow after every slot
    # (~/.local/bin/publish-kick.sh); these extra entries are the fallback for
    # when the Mac is off. Costs 7 extra runs a day, roughly 7 Actions minutes.
    - cron: "6 6,10,12,16,17,18,20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be sent, send nothing"
        type: boolean
        default: false
      force_buffer_alert:
        description: "Send the queue-depth alert now, whatever the hour"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish due posts
        env:
          EN_CHANNEL_BOT_TOKEN: ${{ secrets.EN_CHANNEL_BOT_TOKEN }}
          EN_CHANNEL_ID: ${{ vars.EN_CHANNEL_ID }}
          HE_CHANNEL_BOT_TOKEN: ${{ secrets.HE_CHANNEL_BOT_TOKEN }}
          HE_CHANNEL_ID: ${{ vars.HE_CHANNEL_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 publish.py

      - name: Check buffer depth
        env:
          ALERT_BOT_TOKEN: ${{ secrets.ALERT_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ vars.ALERT_CHAT_ID }}
          FORCE_CHECK: ${{ inputs.force_buffer_alert && '1' || '0' }}
        run: python3 buffer_check.py

      - name: Commit what was published
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "channel-scheduler"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "publish run $(date -u +%FT%TZ)"
          # The Mac pushes to this branch too; rebase instead of failing.
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1
