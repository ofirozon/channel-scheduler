name: publish due posts

on:
  schedule:
    # Hourly at :01 UTC. Any post whose slot time has passed goes out on the
    # next run, so a delayed or skipped run self-heals instead of losing a post.
    # The buffer alarm rides on this same run and picks its own hours; it used
    # to have a dedicated "1 9 * * *" line, but that collides with the hourly
    # one and GitHub delivers only a single schedule event, so the alarm step
    # was skipped every day it was supposed to fire.
    # Every 10 minutes. It used to be hourly, which read as "at worst an hour
    # late" but was not: GitHub delays or drops schedule events under load, and
    # on 20.9.2026 the real gap between runs hit 3 to 5 hours twice in one day,
    # leaving both morning Hebrew posts sitting in the queue. Running this often
    # is free because the repo is public (public repos get unlimited Actions
    # minutes), and the Mac kicks this same workflow after each slot on top of
    # it (~/.local/bin/publish-kick.sh) for the case where GitHub drifts anyway.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be sent, send nothing"
        type: boolean
        default: false
      force_buffer_alert:
        description: "Send the queue-depth alert now, whatever the hour"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish due posts
        env:
          EN_CHANNEL_BOT_TOKEN: ${{ secrets.EN_CHANNEL_BOT_TOKEN }}
          EN_CHANNEL_ID: ${{ vars.EN_CHANNEL_ID }}
          HE_CHANNEL_BOT_TOKEN: ${{ secrets.HE_CHANNEL_BOT_TOKEN }}
          HE_CHANNEL_ID: ${{ vars.HE_CHANNEL_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 publish.py

      - name: Check buffer depth
        env:
          ALERT_BOT_TOKEN: ${{ secrets.ALERT_BOT_TOKEN }}
          # A secret, not a variable: this repo went public on 20.9.2026 and
          # GitHub masks secrets in logs but prints vars in the clear, which
          # would have put Ofir's personal Telegram chat id in a public log.
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          FORCE_CHECK: ${{ inputs.force_buffer_alert && '1' || '0' }}
        run: python3 buffer_check.py

      - name: Commit what was published
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "channel-scheduler"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "publish run $(date -u +%FT%TZ)"
          # The Mac pushes to this branch too; rebase instead of failing.
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1
